<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08243d">
    <meta name="description" content="Read scientific publications, related research papers and conference presentations by members of the GODS planetary science research group.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Publications and Conference Presentations | GODS">
    <meta property="og:description" content="Read scientific publications, related research papers and conference presentations by members of the GODS planetary science research group.">
    <meta property="og:image" content="https://godsastronomy.github.io/gods/assets/images/hero-orbits.webp">

    <title>Publications and Conference Presentations | GODS</title>

    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/style.css">

    <script defer src="assets/js/content.js"></script>
    <script defer src="assets/js/layout.js"></script>

    <meta property="og:url" content="https://godsastronomy.github.io/gods/publications.html">
    <link rel="canonical" href="https://godsastronomy.github.io/gods/publications.html">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div id="site-header-placeholder"></div>

    <main id="main">

        <!-- PAGE HEADER -->
        <section class="page-hero">
            <img
                class="hero-bg"
                src="assets/images/rings.webp"
                alt=""
                aria-hidden="true"
            >

            <div class="container">
                <div class="breadcrumb">
                    <a href="index.html">GODS</a>
                    <span>/</span>
                    <span>Publications</span>
                </div>

                <h1 class="display">
                    Our scientific contributions
                </h1>

            </div>
        </section>


        <!-- PUBLICATIONS AND CONFERENCE PRESENTATIONS -->
        <section class="archive-section surface-white">
            <div class="container">

                <div class="archive-tools">

                    <div
                        class="tabs"
                        role="tablist"
                        aria-label="Research output categories"
                    >
                        <button
                            type="button"
                            role="tab"
                            data-publication-tab="group"
                            aria-selected="true"
                        >
                            Group Publications
                        </button>

                        <button
                            type="button"
                            role="tab"
                            data-publication-tab="related"
                            aria-selected="false"
                        >
                            Related Publications
                        </button>

                        <button
                            type="button"
                            role="tab"
                            data-publication-tab="presentations"
                            aria-selected="false"
                        >
                            Conference Presentations
                        </button>
                    </div>

                    <div class="filter-fields">

                        <label class="sr-only" for="publication-search">
                            Search research output
                        </label>

                        <input
                            type="search"
                            id="publication-search"
                            autocomplete="off"
                            placeholder="Search titles, authors, events…"
                        >

                        <label class="sr-only" for="publication-year">
                            Filter by year
                        </label>

                        <select id="publication-year">
                            <option value="">All years</option>
                        </select>

                    </div>
                </div>

                <div
                    id="publication-count"
                    class="result-count"
                    aria-live="polite"
                ></div>

                <div
                    id="publications-list"
                    aria-live="polite"
                ></div>

            </div>
        </section>

    </main>

    <div id="site-footer-placeholder"></div>
</body>

</html>
